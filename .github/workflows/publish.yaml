name: publish

on:
  push:
    tags:
      - upstream-*

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup environment
        uses: actions/setup-python@v3
        with:
          python-version: 3.13

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login (ghcr)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ghcr.io/alterakey/blutter
          tags: |
            type=match,pattern=upstream-([0-9a-f]{7}),group=1

      - name: Check out code
        uses: actions/checkout@v3

      - name: Building and pushing container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            rev="${{ steps.meta.outputs.tags[0] }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=alterakey/blutter:buildcache
          cache-to: type=registry,ref=alterakey/blutter:buildcachez,mode=max
